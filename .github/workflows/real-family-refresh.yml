name: Refresh Real Family published data
on:
  schedule:
    - cron: '7 * * * *'
    - cron: '0 7,8 * * *'
    - cron: '23 7,8 * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: real-family-published-data
  cancel-in-progress: false
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Pull complete English editions from the public source
        run: python realfamily/scripts/sync_english_source.py
      - name: Pull complete new kitchen editions from the public source
        run: python realfamily/scripts/sync_kitchen_source.py
      - name: Refresh three-hour feeds and Pacific midnight editions
        run: python realfamily/scripts/refresh.py
      - name: Publish source update
        run: |
          git config user.name 'Real Family updater'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add realfamily/data/latest.json realfamily/data/research-archive.json realfamily/data/english-history.json realfamily/data/english-archive realfamily/data/english-staged realfamily/data/daily-history.json realfamily/data/health-archive realfamily/data/recipes-archive realfamily/data/recipes-staged realfamily/data/english-images realfamily/assets/english
          git diff --cached --quiet || git commit -m 'Refresh Real Family news, markets and research'
          git push
