name: Refresh Real Family published data
on:
  schedule:
    - cron: '0 * * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: real-family-published-data
  cancel-in-progress: false
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Refresh hourly feeds and Pacific midnight editions
        run: python realfamily/scripts/refresh.py
      - name: Publish source update
        run: |
          git config user.name 'Real Family updater'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add realfamily/data/latest.json
          git diff --cached --quiet || git commit -m 'Refresh Real Family news, markets and research'
          git push
